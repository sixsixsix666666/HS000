var DATA_MAP = {};
DATA.forEach(function(item) { DATA_MAP[item.area] = item; });
var currentArea = "";

function renderList(filter) {
    var items = DATA;
    if (filter) {
        var kw = filter.toLowerCase();
        items = DATA.filter(function(d) {
            return d.area.toLowerCase().indexOf(kw) >= 0 || d.id.toLowerCase().indexOf(kw) >= 0;
        });
    }
    var html = "";
    items.forEach(function(item, idx) {
        html += '<div class="list-item" onclick="showDetail('' + escHtml(item.area) + '')">' +
            '<div class="num">' + (idx + 1) + '</div>' +
            '<div class="info">' +
                '<div class="area">' + escHtml(item.area) + '</div>' +
                '<div class="preview">' + escHtml(item.copywriting.substring(0, 40)) + '...</div>' +
            '</div>' +
            '<div class="arrow">&rsaquo;</div>' +
        '</div>';
    });
    if (items.length === 0) html = '<div style="text-align:center;padding:40px;color:#999;">未找到匹配</div>';
    document.getElementById("listContainer").innerHTML = html;
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function filterList() {
    renderList(document.getElementById("searchInput").value);
}

function showDetail(area) {
    var item = DATA_MAP[area];
    if (!item) return;
    currentArea = area;
    document.getElementById("listView").style.display = "none";
    document.getElementById("mainHeader").style.display = "none";
    document.getElementById("detailView").classList.add("active");
    document.getElementById("detailHeader").style.display = "";
    document.getElementById("detailTitle").textContent = item.area;
    document.getElementById("detailArea").textContent = item.area + " 黄金回收文案";
    document.getElementById("detailText").textContent = item.copywriting;
    document.getElementById("shareUrlDisplay").textContent = getShareUrl(area);
    window.location.hash = "#" + area;
    window.scrollTo(0, 0);
}

function getShareUrl(area) {
    return window.location.origin + window.location.pathname + "#" + area;
}

function goBack() {
    document.getElementById("listView").style.display = "";
    document.getElementById("mainHeader").style.display = "";
    document.getElementById("detailView").classList.remove("active");
    document.getElementById("detailHeader").style.display = "none";
    window.location.hash = "";
    currentArea = "";
}

function copyText() {
    var item = DATA_MAP[currentArea];
    if (!item) return;
    copyToClipboard(item.copywriting, "文案已复制");
}

function shareLink() {
    var url = getShareUrl(currentArea);
    var item = DATA_MAP[currentArea];
    if (navigator.share) {
        navigator.share({ title: item.area + " - 黄金回收文案", text: item.area + "黄金回收文案", url: url }).catch(function(){});
    } else {
        copyToClipboard(url, "链接已复制，可发送给他人");
    }
}

function copyToClipboard(text, msg) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function() { showToast(msg); });
    } else {
        var ta = document.createElement("textarea");
        ta.value = text; ta.style.cssText = "position:fixed;left:-9999px";
        document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); showToast(msg); } catch(e) { showToast("复制失败，请手动复制"); }
        document.body.removeChild(ta);
    }
}

function showToast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    setTimeout(function() { t.classList.remove("show"); }, 1800);
}

function getAreaFromHash() {
    var raw = window.location.hash.substring(1);
    if (!raw) return null;
    if (DATA_MAP[raw]) return raw;
    try { var d = decodeURIComponent(raw); if (DATA_MAP[d]) return d; } catch(e) {}
    try { var e = encodeURIComponent(raw); if (DATA_MAP[e]) return e; } catch(e) {}
    // 中文被编码时尝试解码
    if (raw.indexOf('%') >= 0) {
        try { var d2 = decodeURIComponent(raw); if (DATA_MAP[d2]) return d2; } catch(e) {}
    }
    return null;
}

window.addEventListener("hashchange", function() {
    var area = getAreaFromHash();
    if (area) showDetail(area); else goBack();
});
